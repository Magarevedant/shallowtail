  <body>
    <nav class="app-nav" aria-label="Main navigation">
      <a class="app-brand" href="/">Shallowtail</a>
      <div>
        <a href="/generate.html" aria-current="page">Create link</a>
        <a href="/track.html">Payment tracker</a>
      </div>
    </nav>
    <main class="page-shell">
      <section class="card">
        <p class="eyebrow">SIMPLE · SECURE · UPI</p>
        <div class="heading-with-info">
          <h1>Create a payment link</h1>
          <span class="info-icon" tabindex="0" role="img" aria-label="Information: Enter an amount. Your saved merchant profile will be included automatically.">
            i
            <span class="info-tooltip" role="tooltip">Enter an amount. Your saved merchant profile will be included automatically.</span>
          </span>
        </div>
        <form id="payment-form">
          <label for="amount">Price <span class="required">Required</span></label>
          <div class="input-with-prefix">
            <span aria-hidden="true">₹</span>
            <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
          </div>

          <div id="customer-contact" class="customer-contact" hidden>
            <label for="customer-phone">
              <span>Customer phone number <span class="required">Required</span></span>
              <span class="info-icon" tabindex="0" role="img" aria-label="Information: Enter the number without its country code or leading zero. It is not saved.">
                i
                <span class="info-tooltip" role="tooltip">Enter the number without its country code or leading zero. It is not saved.</span>
              </span>
            </label>
            <div class="phone-input">
              <select id="country-code" name="country_code" aria-label="Country calling code">
                <option value="+91" selected>India (+91)</option>
                <option value="+1">US / Canada (+1)</option>
                <option value="+44">United Kingdom (+44)</option>
                <option value="+61">Australia (+61)</option>
                <option value="+64">New Zealand (+64)</option>
                <option value="+49">Germany (+49)</option>
                <option value="+33">France (+33)</option>
                <option value="+65">Singapore (+65)</option>
                <option value="+971">United Arab Emirates (+971)</option>
                <option value="+966">Saudi Arabia (+966)</option>
              </select>
              <input id="customer-phone" name="customer_phone" type="tel" inputmode="numeric" pattern="[0-9]{4,14}" maxlength="14" placeholder="9876543210" autocomplete="tel-national">
            </div>
          </div>

          <button type="submit">Create payment link <span aria-hidden="true">→</span></button>
        </form>
        <div id="result" aria-live="polite"></div>
        <p class="profile-link">Merchant details saved? <a href="/setup.html">Edit your setup</a></p>
      </section>
    </main>
    <script src="/payment-store.js"></script>
    <script>
      const form = document.getElementById("payment-form");
      const result = document.getElementById("result");
      const customerContact = document.getElementById("customer-contact");
      const customerPhone = document.getElementById("customer-phone");
      const countryCode = document.getElementById("country-code");
      let merchantProfile;
      let shareMethod = "";

      async function shareOrCopy(paymentUrl, status) {
        if (typeof navigator.share === "function") {
          try {
            await navigator.share({ title: "UPI payment link", url: paymentUrl });
            status.textContent = "Link shared.";
            return;
          } catch (error) {
            if (error instanceof DOMException && error.name === "AbortError") {
              status.textContent = "Sharing cancelled. Copy the link above if needed.";
              return;
            }
          }
        }

        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          try {
            await navigator.clipboard.writeText(paymentUrl);
            status.textContent = "Link copied to clipboard.";
            return;
          } catch {
            status.textContent = "Could not share or copy the link. Copy the URL above to share it.";
            return;
          }
        }

        status.textContent = "Sharing is unavailable here. Copy the URL above to share it.";
      }

      try {
        const savedProfile = localStorage.getItem("shallowtail:merchant");
        merchantProfile = savedProfile ? JSON.parse(savedProfile) : null;
        if (merchantProfile && (
          merchantProfile.share_method === "whatsapp"
          || merchantProfile.share_method === "sms"
        )) {
          shareMethod = merchantProfile.share_method;
        }
      } catch {
        result.className = "result-card error";
        result.textContent = "Could not read your saved merchant setup. Please enable local storage and try again.";
      }

      if (!merchantProfile && !result.textContent) {
        window.location.replace("/setup.html");
      } else if (merchantProfile && (
        typeof merchantProfile.upi_id !== "string"
        || !/^[A-Za-z0-9._\-]+@[A-Za-z0-9.-]+$/.test(merchantProfile.upi_id)
      )) {
        window.location.replace("/setup.html");
      }

      if (shareMethod) {
        customerContact.hidden = false;
        customerPhone.required = true;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!merchantProfile) {
          result.className = "result-card error";
          result.textContent = "Complete your merchant setup before creating a payment link.";
          return;
        }

        const formData = new FormData(form);
        const nationalNumber = formData.get("customer_phone").toString().replace(/^0+/, "");
        const dialingCode = formData.get("country_code").toString().replace(/\D/g, "");
        if (shareMethod && (
          nationalNumber.length + dialingCode.length < 7
          || nationalNumber.length + dialingCode.length > 15
        )) {
          result.className = "result-card error";
          result.textContent = "Enter a valid phone number with the selected country code.";
          return;
        }

        const button = form.querySelector("button[type=submit]");
        button.disabled = true;
        result.replaceChildren();
        result.textContent = "Creating payment link...";

        try {
          const response = await fetch("/api/payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              amount: formData.get("amount").toString(),
              upi_id: merchantProfile.upi_id,
              merchant_name: merchantProfile.merchant_name,
              email: merchantProfile.email,
              note: "",
            }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Could not create payment link.");
          }

          const paymentUrl = new URL(data.url, window.location.origin);
          const link = document.createElement("a");
          link.href = paymentUrl.href;
          link.textContent = paymentUrl.href;
          const message = document.createElement("p");
          message.textContent = shareMethod
            ? `Your payment link is ready. Opening ${shareMethod === "whatsapp" ? "WhatsApp" : "SMS"}…`
            : "Your payment link is ready. Opening the share sheet…";
          const shareStatus = document.createElement("p");
          shareStatus.className = "share-status";
          result.className = "result-card";
          result.replaceChildren(message, link, shareStatus);
          if (shareMethod) {
            const amount = formData.get("amount").toString();
            const customerMessage = `Hi, please pay ₹${amount}: ${paymentUrl.href}`;
            const fullPhoneNumber = `${dialingCode}${nationalNumber}`;
            const deliveryUrl = shareMethod === "whatsapp"
              ? `https://wa.me/${fullPhoneNumber}?text=${encodeURIComponent(customerMessage)}`
              : `sms:+${fullPhoneNumber}?body=${encodeURIComponent(customerMessage)}`;
            shareStatus.textContent = "Review the message and tap Send in the app that opens.";
            window.location.assign(deliveryUrl);
          }

          const trackerMessage = document.createElement("p");
          trackerMessage.className = "tracker-status";
          try {
            window.ShallowtailPayments.add({
              amount: formData.get("amount").toString(),
              note: "",
              url: paymentUrl.href,
              createdAt: new Date().toISOString(),
              status: "unpaid",
            });
            trackerMessage.textContent = "Saved as unpaid in your payment tracker.";
            const trackerLink = document.createElement("a");
            trackerLink.href = "/track.html";
            trackerLink.textContent = "View tracker";
            trackerMessage.append(" ", trackerLink);
          } catch (error) {
            trackerMessage.classList.add("error-text");
            trackerMessage.textContent = error instanceof Error
              ? `Payment link created, but it could not be saved to your tracker: ${error.message}`
              : "Payment link created, but it could not be saved to your tracker.";
          }
          result.append(trackerMessage);
          if (!shareMethod) {
            await shareOrCopy(paymentUrl.href, shareStatus);
          }
        } catch (error) {
          result.className = "result-card error";
          result.textContent = error instanceof Error ? error.message : "Could not create payment link.";
        } finally {
          button.disabled = false;
        }
      });
    </script>
