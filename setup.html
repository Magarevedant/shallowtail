<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Merchant setup — Shallowtail</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="card">
        <p class="eyebrow">ONE-TIME SETUP</p>
        <h1>Your merchant details</h1>
        <p class="intro">Saved only in this browser and added to each payment link you create.</p>
        <form id="setup-form">
          <label for="upi-id">Merchant UPI ID <span class="required">Required</span></label>
          <input id="upi-id" name="upi_id" type="text" pattern="[A-Za-z0-9._\x2d]+@[A-Za-z0-9.\x2d]+" maxlength="100" placeholder="name@bank" autocomplete="off" required>

          <label for="merchant-name">Merchant name <span class="required">Optional</span></label>
          <input id="merchant-name" name="merchant_name" type="text" maxlength="100" placeholder="Your business or name" autocomplete="organization">

          <label for="email">Contact email <span class="required">Optional</span></label>
          <input id="email" name="email" type="email" maxlength="254" placeholder="you@example.com" autocomplete="email">

          <button type="submit">Save and continue <span aria-hidden="true">→</span></button>
        </form>
        <div id="setup-message" aria-live="polite"></div>
        <p class="profile-link"><a href="/">Back to home</a></p>
      </section>
    </main>
    <script>
      const setupForm = document.getElementById("setup-form");
      const setupMessage = document.getElementById("setup-message");

      try {
        const savedProfile = localStorage.getItem("shallowtail:merchant");
        if (savedProfile) {
          const profile = JSON.parse(savedProfile);
          setupForm.elements.upi_id.value = profile.upi_id || "";
          setupForm.elements.merchant_name.value = profile.merchant_name || "";
          setupForm.elements.email.value = profile.email || "";
        }
      } catch {
        setupMessage.className = "result-card error";
        setupMessage.textContent = "Could not read your saved setup. You can enter your details again and save them.";
      }

      setupForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const formData = new FormData(setupForm);
        const profile = {
          upi_id: formData.get("upi_id").toString().trim(),
          merchant_name: formData.get("merchant_name").toString().trim(),
          email: formData.get("email").toString().trim(),
        };

        try {
          localStorage.setItem("shallowtail:merchant", JSON.stringify(profile));
          window.location.assign("/generate.html");
        } catch {
          setupMessage.className = "result-card error";
          setupMessage.textContent = "Your setup could not be saved. Please enable local storage and try again.";
        }
      });
    </script>
    <footer class="site-footer">A Vedant Magare Production</footer>
  </body>
</html>
