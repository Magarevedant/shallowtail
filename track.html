  <body>
    <nav class="app-nav" aria-label="Main navigation">
      <a class="app-brand" href="/">Shallowtail</a>
      <div>
        <a href="/generate.html">Create link</a>
        <a href="/track.html" aria-current="page">Payment tracker</a>
      </div>
    </nav>
    <main class="tracker-shell">
      <div class="tracker-heading">
        <div>
          <p class="eyebrow">YOUR PAYMENTS</p>
          <h1>Payment tracker</h1>
          <p class="intro">Saved only in this browser. Payment statuses are manual and aren’t verified by UPI.</p>
        </div>
        <a class="home-cta" href="/generate.html">Create a payment link <span aria-hidden="true">→</span></a>
      </div>
      <div id="tracker-message" class="result-card tracker-message" aria-live="polite"></div>
      <section id="tracker-summary" class="tracker-summary" aria-label="Payment totals"></section>
      <div id="tracker-filters" class="tracker-filters" role="group" aria-label="Filter payments by status">
        <button class="filter-button" type="button" data-filter="all" aria-pressed="true">
          All <span class="filter-count">0</span>
        </button>
        <button class="filter-button" type="button" data-filter="paid" aria-pressed="false">
          Paid <span class="filter-count">0</span>
        </button>
        <button class="filter-button" type="button" data-filter="unpaid" aria-pressed="false">
          Unpaid <span class="filter-count">0</span>
        </button>
      </div>
      <section id="tracker-list" class="tracker-list" aria-label="Created payments"></section>
    </main>
    <footer class="site-footer">A Vedant Magare Production</footer>
    <script src="/payment-store.js"></script>
    <script>
      const trackerList = document.getElementById("tracker-list");
      const trackerSummary = document.getElementById("tracker-summary");
      const trackerMessage = document.getElementById("tracker-message");
      const trackerFilters = document.getElementById("tracker-filters");
      let activeFilter = "all";
      const currency = new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 2,
      });

      function element(tagName, className, text) {
        const node = document.createElement(tagName);
        if (className) {
          node.className = className;
        }
        if (text) {
          node.textContent = text;
        }
        return node;
      }

      function render() {
        trackerList.replaceChildren();
        trackerSummary.replaceChildren();
        trackerMessage.className = "result-card tracker-message";
        trackerMessage.textContent = "";

        let payments;
        try {
          payments = window.ShallowtailPayments.list();
        } catch (error) {
          trackerMessage.classList.add("error");
          trackerMessage.textContent = error instanceof Error
            ? error.message
            : "Could not load your saved payment tracker.";
          return;
        }

        const paidCount = payments.filter((payment) => payment.status === "paid").length;
        const unpaidCount = payments.length - paidCount;
        const filterCounts = { all: payments.length, paid: paidCount, unpaid: unpaidCount };
        trackerFilters.querySelectorAll("[data-filter]").forEach((button) => {
          const filter = button.dataset.filter;
          button.setAttribute("aria-pressed", String(filter === activeFilter));
          button.querySelector(".filter-count").textContent = String(filterCounts[filter]);
        });
        [
          ["Total", payments.length],
          ["Paid", paidCount],
          ["Unpaid", unpaidCount],
        ].forEach(([label, count]) => {
          const item = element("div", "summary-item");
          item.append(element("strong", "", String(count)), element("span", "", label));
          trackerSummary.append(item);
        });

        if (payments.length === 0) {
          const empty = element("div", "empty-tracker");
          empty.append(
            element("p", "", "No payments tracked yet. Created payment links will appear here."),
          );
          const createLink = element("a", "", "Create your first payment link");
          createLink.href = "/generate.html";
          empty.append(createLink);
          trackerList.append(empty);
          return;
        }

        const visiblePayments = activeFilter === "all"
          ? payments
          : payments.filter((payment) => payment.status === activeFilter);
        if (visiblePayments.length === 0) {
          trackerList.append(element("div", "empty-tracker", `No ${activeFilter} payments yet.`));
          return;
        }

        visiblePayments.forEach((payment) => {
          const entry = element("article", `payment-entry ${payment.status}`);
          const details = document.createElement("div");
          details.append(
            element("h2", "", currency.format(Number(payment.amount))),
            element("p", "entry-note", payment.note || "No payment note"),
            element("p", "", new Date(payment.createdAt).toLocaleString()),
          );
          const statusLabel = payment.status === "paid" ? "Paid" : "Unpaid";
          const status = element("p", `entry-status ${payment.status}`, `Status: ${statusLabel}`);
          details.append(status);

          const link = element("a", "", "Open payment link");
          link.href = payment.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          details.append(link);

          const toggle = element("button", "", payment.status === "paid" ? "Mark as unpaid" : "Mark as paid");
          toggle.type = "button";
          toggle.setAttribute("aria-pressed", String(payment.status === "paid"));
          toggle.setAttribute("aria-label", `${payment.status === "paid" ? "Mark unpaid" : "Mark paid"}: ${currency.format(Number(payment.amount))}`);
          toggle.addEventListener("click", () => {
            try {
              window.ShallowtailPayments.setStatus(
                payment.id,
                payment.status === "paid" ? "unpaid" : "paid",
              );
              render();
            } catch (error) {
              trackerMessage.className = "result-card tracker-message error";
              trackerMessage.textContent = error instanceof Error
                ? error.message
                : "Could not update the payment status.";
            }
          });

          entry.append(details, toggle);
          trackerList.append(entry);
        });
      }

      trackerFilters.addEventListener("click", (event) => {
        const button = event.target instanceof Element
          ? event.target.closest("[data-filter]")
          : null;
        if (!button) {
          return;
        }
        activeFilter = button.dataset.filter;
        render();
      });

      window.addEventListener("storage", (event) => {
        if (event.key === "shallowtail:payments") {
          render();
        }
      });

      render();
    </script>
    <script src="/pwa.js"></script>
  </body>
